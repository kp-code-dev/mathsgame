<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Diamond / Octahedral Crystal Base -->
  <polygon points="50,8 90,50 50,92 10,50" fill="#3b0764" stroke="url(#purpleGrad)" stroke-width="4" filter="url(#glowPurple)"/>
  <!-- Hasse Diagram Lattice Connections -->
  <line x1="50" y1="8" x2="30" y2="44" stroke="#c084fc" stroke-width="2.5"/>
  <line x1="50" y1="8" x2="70" y2="44" stroke="#c084fc" stroke-width="2.5"/>
  <line x1="30" y1="44" x2="50" y2="92" stroke="#c084fc" stroke-width="2.5"/>
  <line x1="70" y1="44" x2="50" y2="92" stroke="#c084fc" stroke-width="2.5"/>
  <line x1="30" y1="44" x2="70" y2="44" stroke="#e879f9" stroke-width="2" stroke-dasharray="3,3"/>
  <!-- Top Element 1 (Join / LUB) -->
  <circle cx="50" cy="8" r="5" fill="#f472b6"/>
  <!-- Atoms (Join Irreducibles) -->
  <circle cx="30" cy="44" r="5" fill="#c084fc"/>
  <circle cx="70" cy="44" r="5" fill="#c084fc"/>
  <!-- Bottom Element 0 (Meet / GLB) -->
  <circle cx="50" cy="92" r="5" fill="#e879f9"/>
</svg>
