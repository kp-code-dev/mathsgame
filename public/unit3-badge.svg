<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Polyhedral Convex Hull Polygon -->
  <polygon points="50,12 86,34 76,82 24,82 14,34" fill="#451a03" stroke="url(#amberGrad)" stroke-width="4" filter="url(#glowAmber)"/>
  <!-- Feasible region triangulation lines -->
  <line x1="50" y1="12" x2="76" y2="82" stroke="#d97706" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="50" y1="12" x2="24" y2="82" stroke="#d97706" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="14" y1="34" x2="86" y2="34" stroke="#d97706" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Feasible Vertices -->
  <circle cx="14" cy="34" r="4" fill="#fbbf24"/>
  <circle cx="24" cy="82" r="4" fill="#fbbf24"/>
  <circle cx="76" cy="82" r="4" fill="#fbbf24"/>
  <circle cx="86" cy="34" r="4" fill="#fbbf24"/>
  <!-- Optimal Corner Vertex (Glowing Star Target) -->
  <circle cx="50" cy="12" r="6" fill="#fef08a"/>
  <circle cx="50" cy="12" r="10" fill="none" stroke="#f59e0b" stroke-width="2"/>
</svg>
