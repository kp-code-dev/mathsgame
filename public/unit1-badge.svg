<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Outer Shield Polygon -->
  <polygon points="50,6 88,22 88,60 50,94 12,60 12,22" fill="#082f49" stroke="url(#cyberHex)" stroke-width="4" filter="url(#glowCyan)"/>
  <!-- Inner Circuit Grid & Permutation Matrix Nodes -->
  <circle cx="50" cy="32" r="5" fill="#38bdf8"/>
  <circle cx="32" cy="52" r="5" fill="#06b6d4"/>
  <circle cx="68" cy="52" r="5" fill="#06b6d4"/>
  <circle cx="50" cy="72" r="5" fill="#38bdf8"/>
  <!-- Connecting Laser lines -->
  <line x1="50" y1="32" x2="32" y2="52" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="50" y1="32" x2="68" y2="52" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="32" y1="52" x2="68" y2="52" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="3,3"/>
  <line x1="32" y1="52" x2="50" y2="72" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="68" y1="52" x2="50" y2="72" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="50" cy="52" r="3" fill="#ffffff"/>
</svg>
