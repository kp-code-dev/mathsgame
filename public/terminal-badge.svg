<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberTermGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="termGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Window Base -->
  <rect x="12" y="15" width="76" height="70" rx="10" fill="#030712" stroke="url(#cyberTermGrad)" stroke-width="3.5" filter="url(#termGlow)" />
  <!-- Title bar line -->
  <line x1="12" y1="32" x2="88" y2="32" stroke="#1e293b" stroke-width="2" />
  <!-- Window Buttons -->
  <circle cx="22" cy="23.5" r="3" fill="#ef4444" />
  <circle cx="31" cy="23.5" r="3" fill="#f59e0b" />
  <circle cx="40" cy="23.5" r="3" fill="#10b981" />
  <!-- Prompt Symbol >_ -->
  <path d="M 26 46 L 40 56 L 26 66" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Cursor block -->
  <rect x="48" y="60" width="16" height="6" fill="#38bdf8" rx="1" />
</svg>

