<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Circular Compass / Oscilloscope Base -->
  <circle cx="50" cy="50" r="44" fill="#064e3b" stroke="url(#emeraldGrad)" stroke-width="4" filter="url(#glowEmerald)"/>
  <!-- Cartesian Grid lines -->
  <line x1="16" y1="50" x2="84" y2="50" stroke="#047857" stroke-width="2"/>
  <line x1="50" y1="16" x2="50" y2="84" stroke="#047857" stroke-width="2"/>
  <!-- Continuous Newton Curve (Parabola) -->
  <path d="M 22 28 Q 50 82 78 28" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  <!-- Tangent Line hitting Root -->
  <line x1="28" y1="54" x2="72" y2="34" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4,2"/>
  <!-- Target Root Intersection Point -->
  <circle cx="62" cy="50" r="5" fill="#f59e0b"/>
  <circle cx="62" cy="50" r="8" fill="none" stroke="#fef08a" stroke-width="1.5"/>
</svg>

