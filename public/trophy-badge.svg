<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Cup Body -->
  <path d="M 28 20 L 72 20 C 72 45, 62 60, 50 62 C 38 60, 28 45, 28 20 Z" fill="url(#trophyGold)" stroke="#fef08a" stroke-width="2.5" filter="url(#goldGlow)" />
  <!-- Handles -->
  <path d="M 28 26 C 14 26, 14 46, 32 48" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  <path d="M 72 26 C 86 26, 86 46, 68 48" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  <!-- Stem & Pedestal -->
  <rect x="45" y="62" width="10" height="15" rx="2" fill="#d97706" />
  <path d="M 32 77 L 68 77 L 74 90 L 26 90 Z" fill="#b45309" stroke="#fef08a" stroke-width="2" />
  <!-- Star in Center -->
  <polygon points="50,30 53,38 61,38 55,43 57,51 50,46 43,51 45,43 39,38 47,38" fill="#ffffff" />
</svg>

